{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · RRHH</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-dark:   #162b47;
            --brand-mid:    #105788;
            --brand-red:    #e51148;
            --brand-white:  #ffffff;
            --gray-100:     #f1f4f7;
            --gray-200:     #dde3ea;
            --gray-400:     #94a3b8;
            --gray-500:     #64748b;
            --gray-700:     #334155;
            --gray-900:     #0f172a;
            --radius:       16px;
            --radius-sm:    10px;
            --shadow:       0 20px 48px rgba(22,43,71,.16), 0 8px 20px rgba(22,43,71,.1);
            --shadow-sm:    0 4px 16px rgba(22,43,71,.1), 0 2px 6px rgba(22,43,71,.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Fondo dinámico sutil */
        .bg-decoration {
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% 10%, rgba(16,87,136,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 40% 50% at 90% 80%, rgba(229,17,72,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 10% 20%, rgba(22,43,71,0.05) 0%, transparent 60%);
        }
        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(16,87,136,0.03);
            transform: rotate(45deg);
            pointer-events: none;
        }
        .bg-decoration::after {
            content: '';
            position: absolute;
            bottom: -120px;
            left: -80px;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(229,17,72,0.03);
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px 36px 36px;
            border: 1px solid var(--gray-200);
            backdrop-filter: blur(2px);
            animation: floatIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) both;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }

        .logo-img {
            width: 200px;
            height: auto;
            max-height: 120px;
            margin-bottom: 16px;
            filter: drop-shadow(0 8px 16px rgba(16,87,136,0.25));
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--brand-dark);
            letter-spacing: -0.3px;
            line-height: 1.2;
            text-align: center;
        }
        .logo-sub {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            pointer-events: none;
            display: flex;
            align-items: center;
        }
        .input-wrapper .input-icon svg {
            width: 18px;
            height: 18px;
        }

        .input-wrapper input {
            width: 100%;
            height: 46px;
            padding: 0 16px 0 44px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-family: 'Nunito Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gray-900);
            background: #f8fafc;
            transition: all 0.2s ease;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: var(--brand-mid);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(16,87,136,0.12);
        }
        .input-wrapper input::placeholder {
            color: var(--gray-400);
            font-weight: 500;
        }

        .btn-login {
            width: 100%;
            height: 46px;
            background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-mid) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Nunito Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            box-shadow: 0 4px 14px rgba(16,87,136,0.35);
            position: relative;
            overflow: hidden;
        }
        .btn-login::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.2s;
        }
        .btn-login:hover::after {
            background: rgba(255,255,255,0.1);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(16,87,136,0.5);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login svg {
            width: 18px;
            height: 18px;
        }

        .error-message {
            background: #fce8ee;
            border: 1px solid #fca5a5;
            color: #7f1d2e;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            animation: shake 0.4s ease;
        }
        .error-message svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            fill: #e51148;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--gray-400);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>

    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo-area">
                <img src="{% static 'img/logo_fondo_blanco.png' %}" alt="Logo RRHH" class="logo-img">
                <div class="logo-sub">Universidad S&P </div>
            </div>

            <!-- Mensajes de error desde Django messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Formulario -->
            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input type="text" name="username" id="username" placeholder="Ingresa tu usuario" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input type="password" name="password" id="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Ingresar
                </button>
            </form>

            <div class="footer-note">
                UNIVERSIDAD CORPORATIVA S&P
            </div>
        </div>
    </div>
</body>
</html>
